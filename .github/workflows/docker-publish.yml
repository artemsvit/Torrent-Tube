# Builds the server image, runs the server tests inside it, and only then
# publishes it to Docker Hub - the one source of truth for the NAS, which only
# pulls artsvit/torrenttube:latest. The Apple apps are not part of the image
# (see .dockerignore).
name: Publish server image

on:
  push:
    branches: [main, apple-apps-and-library]
    paths-ignore:
      - "appletv/**"
      - "**.md"
      - "nas-update.sh"
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The image as it will run on the NAS, kept locally for the tests.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: torrenttube:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The tests are not in the image (.dockerignore): mount them in.
      - name: Server tests inside the image
        run: >
          docker run --rm --entrypoint python3
          -v "$PWD/tests:/app/tests:ro" -v "$PWD/nas-update.sh:/app/nas-update.sh:ro"
          -w /app torrenttube:test
          -m unittest discover -s tests
      # The container as the NAS runs it: starts, serves the page and its
      # script, and answers the API.
      - name: Container starts and serves the page
        run: |
          docker run -d --name smoke -p 5058:5058 -v "$RUNNER_TEMP/downloads:/downloads" torrenttube:test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:5058/ > page.html && break; sleep 2; done
          docker logs smoke | tail -20
          grep -q 'static/app.js?v=' page.html
          curl -fs "http://127.0.0.1:5058$(grep -o '/static/app.js?v=[0-9a-f]*' page.html)" > /dev/null
          curl -fs http://127.0.0.1:5058/api/torrents
          curl -fs http://127.0.0.1:5058/api/library > /dev/null
          docker rm -f smoke
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # The same build again, all from cache: only now does it reach Docker Hub.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            artsvit/torrenttube:latest
            artsvit/torrenttube:${{ github.sha }}
          cache-from: type=gha
