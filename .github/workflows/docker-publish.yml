# Builds the server image and publishes it to Docker Hub - the one source of
# truth for the NAS, which only pulls artsvit/torrenttube:latest. The Apple
# apps are not part of the image (see .dockerignore).
name: Publish server image

on:
  push:
    branches: [main, apple-apps-and-library]
    paths-ignore:
      - "appletv/**"
      - "**.md"
      - "nas-update.sh"
  workflow_dispatch:

concurrency:
  group: docker-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            artsvit/torrenttube:latest
            artsvit/torrenttube:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
