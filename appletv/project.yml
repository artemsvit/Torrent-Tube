name: TorrentTubeTV
options:
  # Marks the project as checked by this Xcode, so it stops offering
  # "Update to recommended settings" (the settings are in base below).
  xcodeVersion: '27.0'
  deploymentTarget:
    tvOS: '18.0'
    iOS: '18.0'
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.artsvit.torrenttube.tv
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: 3
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: targeted
    # Xcode's recommended settings.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  TorrentTubeTV:
    type: application
    platform: tvOS
    sources: [TorrentTube, Shared, Core]
    info:
      path: TorrentTube/Info.plist
      properties:
        CFBundleDisplayName: Torrent Tube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.artsvit.torrenttube.tv
            CFBundleURLSchemes: [torrenttube]
        NSLocalNetworkUsageDescription: Torrent Tube connects to your media server to browse your library and stream videos.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: TorrentTube/TorrentTube.entitlements
      properties:
        com.apple.security.application-groups: [group.com.artsvit.torrenttube.tv]
    dependencies:
      - target: TorrentTubeTopShelf
      - framework: Vendor/TVVLCKit.xcframework
        embed: true
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CFNetwork.framework
      - sdk: CoreMedia.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: VideoToolbox.framework
      - sdk: libbz2.tbd
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: libxml2.tbd
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ['$(inherited)', '-ObjC']
  TorrentTubeMobile:
    type: application
    platform: iOS
    sources:
      - Mobile
      - Core
      - Shared/Localization.swift
      - TorrentTube/VLCKit-COPYING.txt
    info:
      path: Mobile/Info.plist
      properties:
        CFBundleDisplayName: Torrent Tube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Torrent Tube connects to your media server to browse your library and stream videos.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CFNetwork.framework
      - sdk: CoreMedia.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: VideoToolbox.framework
      - sdk: libbz2.tbd
      - sdk: libc++.tbd
      - sdk: libiconv.tbd
      - sdk: libxml2.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artsvit.torrenttube.mobile
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: NO
        # Runs on Apple silicon Macs as the iPad app ("Designed for iPad"):
        # VLCKit has no Mac Catalyst build, so this is the Mac option.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        # Signing a Mac build needs a team; the Apple TV targets keep running
        # in the simulator without one.
        DEVELOPMENT_TEAM: 8KK8V96Q6B
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ['$(inherited)', '-ObjC']
  TorrentTubeMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MobileTests, TorrentTubeTests/APITests.swift]
    dependencies:
      - target: TorrentTubeMobile
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.artsvit.torrenttube.mobile.tests
  TorrentTubeMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MobileUITests]
    dependencies:
      - target: TorrentTubeMobile
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.artsvit.torrenttube.mobile.uitests
  TorrentTubeTopShelf:
    type: app-extension
    platform: tvOS
    sources: [TopShelf, Shared]
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Torrent Tube Top Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: TopShelf/TopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.com.artsvit.torrenttube.tv]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artsvit.torrenttube.tv.topshelf
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - sdk: TVServices.framework
  TorrentTubeTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources: [TorrentTubeTests]
    dependencies:
      - target: TorrentTubeTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.artsvit.torrenttube.tv.tests
  TorrentTubeTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [TorrentTubeUITests]
    dependencies:
      - target: TorrentTubeTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.artsvit.torrenttube.tv.uitests
  # The Mac app: the iPhone/iPad screens (Mobile/) as a native macOS app,
  # with VideoLAN's VLCKit for macOS and a window with no title bar.
  TorrentTubeMac:
    type: application
    platform: macOS
    sources:
      - path: Mobile
        excludes: [Info.plist]
      - Core
      - Shared/Localization.swift
      - TorrentTube/VLCKit-COPYING.txt
      - Mac/Assets.xcassets
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Torrent Tube
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        NSLocalNetworkUsageDescription: Torrent Tube connects to your media server to browse your library and stream videos.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    dependencies:
      - framework: Vendor/VLCKit.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.artsvit.torrenttube.mac
        PRODUCT_NAME: Torrent Tube
        DEVELOPMENT_TEAM: 8KK8V96Q6B
        # Mac sizes in the rounded Mac shape (the iPhone icon is a plain square).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS: ['$(inherited)', '@executable_path/../Frameworks']
schemes:
  TorrentTubeTV:
    build:
      targets:
        TorrentTubeTV: all
    test:
      environmentVariables:
        TORRENTTUBE_TEST_SERVER: http://127.0.0.1:5069
        TORRENTTUBE_REFERENCE_SERVER: $(TORRENTTUBE_REFERENCE_SERVER)
      targets: [TorrentTubeTVTests, TorrentTubeTVUITests]
  TorrentTubeMobile:
    build:
      targets:
        TorrentTubeMobile: all
    test:
      environmentVariables:
        TORRENTTUBE_TEST_SERVER: http://127.0.0.1:5069
        TORRENTTUBE_REFERENCE_SERVER: $(TORRENTTUBE_REFERENCE_SERVER)
      targets: [TorrentTubeMobileTests, TorrentTubeMobileUITests]
  TorrentTubeMac:
    build:
      targets:
        TorrentTubeMac: all
