name: torrenttube

services:
  # Jackett scrapes torrent trackers and provides Torznab search.
  # Open http://<host>:9117 to add trackers and copy the API key.
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    ports:
      - "9117:9117"
    volumes:
      - ./jackett-config:/config
      - ./downloads:/downloads
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}

  # Torrent Tube web client & streaming backend.
  # Open http://<host>:5058 to browse, stream, and manage downloads.
  torrenttube:
    image: artsvit/torrenttube:latest
    container_name: torrenttube
    restart: unless-stopped
    depends_on:
      - jackett
    ports:
      - "5058:5058"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ./downloads:/downloads
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      # Destination subfolders inside ./downloads for media library categorization
      - TORRENTTUBE_CATEGORIES=Movies,TV Shows,Cartoon
      # Connects to bundled Jackett container via Docker network
      - JACKETTAPI_URL=http://jackett:9117
