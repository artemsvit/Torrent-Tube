services:
  torrenttube:
    image: artsvit/torrenttube:latest
    # To build from source instead of pulling the published image, comment
    # out the `image:` line above and uncomment this:
    # build:
    #   context: .
    #   network: host  # needed on some NAS/router setups; see README
    container_name: torrenttube
    restart: unless-stopped
    ports:
      - "5058:5058"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - /volume1/homes/artsvit/Media:/downloads
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
      # Must match real subfolder names under the mounted volume above.
      - TORRENTTUBE_CATEGORIES=Cartoon,Movies,TV Shows
      # Optional: enables the Search tab. Point at a Jackett instance (see
      # README) — Jackett holds your tracker login, not this app. Fill in
      # your own Jackett API key here (Jackett's dashboard, top right) —
      # don't commit a real key to a public repo.
      - JACKETTAPI_URL=http://192.168.0.102:9117
      - JACKETTAPI_KEY=changeme
      - JACKETTAPI_INDEXER=mazepa
      # Optional: adds posters/ratings to search results. Free key from
      # https://www.themoviedb.org/settings/api - don't commit a real one.
      - TMDB_API_KEY=changeme
    # Same hairpin-NAT issue as the build (see above), but for the running
    # container: Docker's embedded resolver (127.0.0.11) forwards to the
    # host's DNS server, which is Pi-hole running in another container on
    # this same host — that loopback doesn't route through this NAS's
    # Open vSwitch setup. Point straight at public DNS instead.
    dns:
      - 1.1.1.1
      - 8.8.8.8
